<div #panel popover="manual" class="toast-panel" [class.error]="toast.kind() === 'error'">
  <div [attr.role]="toast.kind() === 'error' ? 'alert' : 'status'" aria-atomic="true" class="toast-content">
    @if (toast.kind() === 'error') {
    <span class="toast-icon" aria-hidden="true">!</span>
    }
    <p>{{ toast.message() }}</p>
    <button type="button" (click)="toast.dismiss()" aria-label="Cerrar notificación">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
        aria-hidden="true">
        <path d="m6 6 12 12M6 18 18 6" />
      </svg>
    </button>
  </div>
</div>
