<div class="pointer-events-none fixed inset-x-4 bottom-[max(1rem,env(safe-area-inset-bottom))] z-50 flex justify-center sm:inset-x-6 sm:justify-end">
  <div role="status" aria-live="polite" aria-atomic="true">
    @if (toast.message()) {
      <div class="pointer-events-auto flex w-full max-w-sm items-center gap-3 rounded-2xl border border-white/15 bg-primary py-3 pl-5 pr-2 text-white shadow-xl">
        <p class="min-w-0 flex-1 break-words text-sm leading-6">{{ toast.message() }}</p>
        <button type="button" (click)="toast.dismiss()" aria-label="Cerrar notificación"
          class="grid size-11 shrink-0 cursor-pointer place-items-center rounded-xl transition-colors hover:bg-white/10 focus-visible:outline-white">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M6 18 18 6" />
          </svg>
        </button>
      </div>
    }
  </div>
</div>
