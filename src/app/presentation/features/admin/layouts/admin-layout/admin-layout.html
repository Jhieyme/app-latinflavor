<div
  class="flex h-dvh overflow-hidden bg-[var(--color-background-secondary)] text-[var(--color-text-primary)]"
>
  @if (menuOpen()) {
    <div class="w-[72px] shrink-0 overflow-y-auto sm:w-[272px]">
      <app-admin-side-nav
        [username]="username()"
        (signedOut)="signOut()"
        (dismissed)="menuOpen.set(false); menuToggle.focus()"
      />
    </div>
  }
  <div class="flex min-w-0 flex-1 flex-col">
    <header
      class="flex min-h-20 shrink-0 items-center justify-between gap-3 border-b border-[var(--color-border)] bg-white px-4 py-3 sm:px-6"
    >
      <button
        type="button"
        #menuToggle
        (click)="menuOpen.set(!menuOpen())"
        [attr.aria-label]="
          menuOpen() ? 'Ocultar menú de administración' : 'Mostrar menú de administración'
        "
        aria-controls="admin-navigation"
        [attr.aria-expanded]="menuOpen()"
        class="grid size-11 shrink-0 cursor-pointer place-items-center rounded-xl text-[var(--color-text-secondary)] transition-colors hover:bg-[var(--color-secondary-light)] hover:text-[var(--color-primary-dark)]"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <path d="M9 4v16" />
        </svg>
      </button>
      <app-admin-account-menu class="min-w-0" [username]="username()" (signedOut)="signOut()" />
    </header>
    <div class="min-h-0 min-w-0 flex-1 overflow-y-auto">
      <router-outlet />
    </div>
  </div>
</div>
