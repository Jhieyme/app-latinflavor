<details #dropdown class="relative" (focusout)="closeOnFocusOut($event)">
  <summary
    #trigger
    aria-label="Opciones de perfil"
    class="flex min-h-11 cursor-pointer list-none items-center gap-3 rounded-xl px-2 py-1.5 transition-colors hover:bg-[var(--color-secondary-light)] focus-visible:outline-2 focus-visible:outline-[var(--color-primary)] [&::-webkit-details-marker]:hidden"
  >
    <span class="max-w-[120px] truncate text-sm font-medium sm:max-w-[240px]">{{
      username()
    }}</span>
    <span
      class="grid size-10 shrink-0 place-items-center rounded-full bg-[var(--color-primary)] text-white"
      aria-hidden="true"
    >
      <svg
        width="21"
        height="21"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
      >
        <circle cx="12" cy="8" r="3" />
        <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
      </svg>
    </span>
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </summary>
  <div
    class="absolute right-0 top-full z-30 mt-2 w-52 rounded-xl border border-[var(--color-border)] bg-white p-1.5 shadow-lg"
  >
    <button
      type="button"
      (click)="signOut()"
      class="flex min-h-11 w-full cursor-pointer items-center gap-3 rounded-lg px-3 py-2 text-left text-sm text-[var(--color-text-secondary)] hover:bg-[var(--color-secondary-light)] hover:text-[var(--color-primary)]"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M12 3v9M6.34 6.34a8 8 0 1 0 11.32 0" />
      </svg>
      Cerrar sesión
    </button>
  </div>
</details>
