<main class="grid min-h-dvh place-items-center bg-cream px-4 py-8">
  <section class="login-card w-full max-w-md overflow-hidden rounded-3xl border border-border bg-white text-primary"
    aria-labelledby="login-title" [attr.aria-busy]="loading()">
    <header class="flex min-h-24 items-center justify-center border-b border-border px-6 py-5">
      <h1 id="login-title" class="mt-3 text-center font-display text-3xl">Iniciar sesión</h1>
    </header>
    <div class="px-6 py-9 sm:px-9">
      @if (session()) {
      <h1 id="login-title" class="mt-3 text-center font-display text-3xl">Sesión iniciada</h1>
      <p class="mt-4 text-center text-sm leading-6 text-muted" role="status">Tu acceso administrativo se verificó
        correctamente.</p>
      <button type="button" (click)="signOut()"
        class="mt-8 min-h-12 w-full cursor-pointer rounded-xl bg-primary px-5 py-3 text-sm font-medium text-white hover:bg-[var(--color-primary-dark)]">Cerrar
        sesión</button>
      } @else {
      <p class="text-center text-sm leading-6 text-muted">Ingresa con tu usuario y contraseña.</p>
      <form #loginForm="ngForm" class="mt-8 space-y-5" (ngSubmit)="submit()">
        <div>
          <label for="admin-username" class="mb-2 block text-sm font-medium">Usuario</label>
          <app-input inputId="admin-username" name="username" type="text" autocomplete="username" autocapitalize="none"
            [spellcheck]="false" required pattern=".*\S.*" [(ngModel)]="username" [disabled]="loading()"
            describedBy="login-error" placeholder="Ingresa tu usuario"></app-input>
        </div>
        <div>
          <label for="admin-password" class="mb-2 block text-sm font-medium">Contraseña</label>
          <div class="app-input-group">
            <app-input inputId="admin-password" name="password" [type]="passwordVisible() ? 'text' : 'password'"
              autocomplete="current-password" required [(ngModel)]="password" [disabled]="loading()"
              describedBy="login-error" placeholder="Ingresa tu contraseña"></app-input>
            <button type="button" (click)="passwordVisible.set(!passwordVisible())" [disabled]="loading()"
              [attr.aria-pressed]="passwordVisible()" aria-label="Mostrar contraseña"
              class="min-h-11 cursor-pointer rounded-lg px-3 text-xs font-semibold text-accent disabled:cursor-not-allowed">{{
              passwordVisible() ? 'Ocultar' : 'Mostrar' }}</button>
          </div>
        </div>
        <button type="submit" [disabled]="loading() || !loginForm.valid"
          class="min-h-13 w-full cursor-pointer rounded-xl bg-primary px-5 py-3.5 text-sm font-medium text-white transition-colors hover:bg-[var(--color-primary-dark)] disabled:cursor-not-allowed disabled:opacity-50">{{
          loading() ? 'Ingresando…' : 'Iniciar sesión' }}</button>
      </form>
      <p id="login-error" class="mt-4 min-h-5 text-center text-sm text-[var(--color-error)]" role="alert">{{
        errorMessage() }}</p>
      }
    </div>
  </section>
</main>
