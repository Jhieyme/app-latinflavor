<div
  class="grid grid-cols-1 gap-4 bg-[var(--color-background-secondary)]/60 p-4 min-[600px]:grid-cols-2 min-[1100px]:grid-cols-3 min-[1400px]:grid-cols-4"
>
  @for (table of tables(); track table.id) {
    <article
      class="group overflow-hidden rounded-2xl border border-[var(--color-border)] bg-white transition-shadow duration-200 hover:shadow-md motion-reduce:transition-none"
    >
      <div class="flex items-center justify-between gap-2 px-4 pt-4">
        <span
          class="truncate text-xs font-semibold tracking-wide text-[var(--color-text-secondary)]"
          [title]="table.tableCode"
          >{{ table.tableCode }}</span
        >
        <span
          class="inline-flex shrink-0 items-center gap-1.5 rounded-full bg-[var(--color-secondary-light)] px-2 py-1 text-[10px] font-medium text-[var(--color-text-secondary)]"
          [style.color]="table.active ? 'var(--color-success)' : null"
        >
          <span class="size-1.5 rounded-full bg-current" aria-hidden="true"></span
          >{{ table.active ? 'Activa' : 'Inactiva' }}
        </span>
      </div>
      <button
        type="button"
        class="block w-full cursor-pointer px-4 pb-4 pt-2 text-center focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-[var(--color-primary)]"
        [attr.aria-label]="'Ver detalle de mesa ' + table.tableNumber + ', ' + table.tableCode"
        (click)="selected.emit({ id: table.id, mode: 'detail' })"
      >
        <svg
          viewBox="0 0 120 120"
          class="mx-auto size-28 text-[var(--color-primary-light)] transition-transform duration-200 group-hover:scale-105 motion-reduce:transform-none motion-reduce:transition-none"
          [class.opacity-40]="!table.active"
          aria-hidden="true"
        >
          @for (seat of seats.slice(0, table.capacity); track $index) {
            <rect
              [attr.x]="seat.x"
              [attr.y]="seat.y"
              width="18"
              height="18"
              rx="5"
              fill="var(--color-secondary-light)"
              stroke="currentColor"
              stroke-width="1.5"
            />
          }
          <rect
            x="30"
            y="30"
            width="60"
            height="60"
            rx="16"
            fill="var(--color-background-secondary)"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <rect
            x="36"
            y="36"
            width="48"
            height="48"
            rx="12"
            fill="none"
            stroke="currentColor"
            stroke-opacity=".15"
          />
          <text
            x="60"
            y="65"
            text-anchor="middle"
            fill="var(--color-primary)"
            font-size="18"
            font-weight="600"
          >
            {{ table.tableNumber }}
          </text>
        </svg>
        <h2 class="text-base font-semibold text-[var(--color-text-primary)]">
          Mesa {{ table.tableNumber }}
        </h2>
        <p class="mt-1 text-xs text-[var(--color-text-secondary)]">
          {{ table.capacity }} {{ table.capacity === 1 ? 'persona' : 'personas' }}
        </p>
      </button>
      <footer
        class="flex items-center justify-between gap-2 border-t border-[var(--color-border-light)] px-3 py-2"
      >
        <button
          type="button"
          class="flex min-h-10 cursor-pointer items-center gap-2 rounded-lg px-2 text-xs font-medium text-[var(--color-primary)] hover:bg-[var(--color-secondary-light)]"
          (click)="selected.emit({ id: table.id, mode: 'edit' })"
          [attr.aria-label]="'Editar mesa ' + table.tableCode"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15v5Z" /></svg
          >Editar
        </button>
        <div class="flex gap-1">
          <button
            type="button"
            class="grid size-10 cursor-pointer place-items-center rounded-lg text-[var(--color-text-secondary)] hover:bg-[var(--color-secondary-light)]"
            title="Detalle"
            [attr.aria-label]="'Ver detalle de ' + table.tableCode"
            (click)="selected.emit({ id: table.id, mode: 'detail' })"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              aria-hidden="true"
            >
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <button
            type="button"
            class="grid size-10 cursor-pointer place-items-center rounded-lg hover:bg-[var(--color-secondary-light)]"
            [style.color]="table.active ? 'var(--color-error)' : 'var(--color-primary)'"
            [title]="table.active ? 'Deshabilitar' : 'Habilitar'"
            [attr.aria-label]="(table.active ? 'Deshabilitar ' : 'Habilitar ') + table.tableCode"
            (click)="selected.emit({ id: table.id, mode: 'status' })"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
      </footer>
    </article>
  }
</div>
