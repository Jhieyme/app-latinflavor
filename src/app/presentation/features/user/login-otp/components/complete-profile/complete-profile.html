<h1 id="validate-title" class="text-center font-display text-3xl font-normal text-black">Completa tu perfil</h1>
<p class="mt-3 text-center text-sm leading-6 text-muted">
  Solo necesitamos algunos datos para personalizar tu experiencia.
</p>

<form #profileForm="ngForm" class="mt-7 space-y-5" (ngSubmit)="completeProfile()">
  <div>
    <label for="name" class="mb-2 block text-sm font-medium text-primary">Nombre</label>
    <app-input inputId="name" name="name" type="text" autocomplete="name" required pattern=".*\S.*" maxlength="100"
      [(ngModel)]="name" placeholder="Ingresa tu nombre"
     ></app-input>
  </div>

  <div>
    <label for="profile-email" class="mb-2 block text-sm font-medium text-primary">Correo electrónico</label>
    <app-input inputId="profile-email" type="email" [value]="email()" disabled
     ></app-input>
  </div>

  <div>
    <label for="phone" class="mb-2 block text-sm font-medium text-primary">Número celular</label>
    <div
      class="app-input-group">
      <span class="grid place-items-center border-r border-border bg-cream px-4 text-sm font-medium text-primary"
        aria-hidden="true">+51</span>
      <app-input inputId="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" required
        pattern="9[0-9]{8}" maxlength="9" [ngModel]="phone" (ngModelChange)="updatePhone($event)"
        placeholder="987 654 321"
       ></app-input>
    </div>
  </div>

  <button type="submit" [disabled]="!profileForm.valid"
    class="flex min-h-13 w-full cursor-pointer items-center justify-center rounded-xl bg-primary px-5 py-3.5 text-sm font-medium text-white transition-colors hover:bg-[var(--color-primary-dark)] disabled:cursor-not-allowed disabled:opacity-50">
    Continuar
  </button>
</form>
