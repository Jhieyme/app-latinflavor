<h1 id="validate-title" class="text-center font-display text-3xl font-normal text-black">{{ editing() ? 'Mi perfil' : 'Completa tu perfil' }}</h1>
<p class="mt-3 text-center text-sm leading-6 text-muted">{{ editing() ? 'Consulta y actualiza tus datos personales.' : 'Completa tus datos para personalizar tu experiencia.' }}</p>
<form #profileForm="ngForm" class="profile-form" (ngSubmit)="completeProfile(profileForm)"
  [attr.aria-busy]="saving()">
  <div class="profile-fields">
  <div><label for="profile-firstName" class="mb-2 block text-sm font-medium text-primary">Nombres</label>
    <app-input inputId="profile-firstName" name="firstName" [(ngModel)]="firstName" required pattern=".*\S.*"
      maxlength="100" autocomplete="given-name" [disabled]="saving()" />
  </div>
  <div><label for="profile-email" class="mb-2 block text-sm font-medium text-primary">Correo electrónico</label>
    <app-input inputId="profile-email" type="email" [value]="email" disabled />
  </div>
  <div><label for="profile-paternalLastName" class="mb-2 block text-sm font-medium text-primary">Apellido
      paterno</label>
    <app-input inputId="profile-paternalLastName" name="paternalLastName" [(ngModel)]="paternalLastName" required
      pattern=".*\S.*" maxlength="100" autocomplete="family-name" [disabled]="saving()" />
  </div>
  <div><label for="profile-maternalLastName" class="mb-2 block text-sm font-medium text-primary">Apellido
      materno</label>
    <app-input inputId="profile-maternalLastName" name="maternalLastName" [(ngModel)]="maternalLastName" required
      pattern=".*\S.*" maxlength="100" autocomplete="off" [disabled]="saving()" />
  </div>
  <div><label for="phone" class="mb-2 block text-sm font-medium text-primary">Número celular</label>
    <div class="app-input-group">
      <span class="grid place-items-center border-r border-border bg-cream px-4 text-sm font-medium text-primary"
        aria-hidden="true">+51</span>
      <app-input inputId="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" required
        pattern="9[0-9]{8}" maxlength="9" [ngModel]="phone" (ngModelChange)="updatePhone($event)"
        [disabled]="saving()" />
    </div>
  </div>
  <div><label for="birth-date" class="mb-2 block text-sm font-medium text-primary">Fecha de nacimiento</label>
    <input id="birth-date" name="birthDate" class="app-input" type="date" [(ngModel)]="birthDate" required
      [max]="maxBirthDate" [disabled]="saving()" />
  </div>
  <div><label for="document-type" class="mb-2 block text-sm font-medium text-primary">Tipo de documento</label>
    <select id="document-type" name="documentType" class="app-input select-control" [(ngModel)]="documentType" required
      [disabled]="saving()">
      <option value="DNI">DNI</option>
      <option value="CE">Carné de extranjería</option>
      <option value="PASSPORT">Pasaporte</option>
    </select>
  </div>
  <div><label for="document-number" class="mb-2 block text-sm font-medium text-primary">Número de documento</label>
    <app-input inputId="document-number" name="documentNumber" [(ngModel)]="documentNumber" required
      [pattern]="documentType === 'DNI' ? '[0-9]{8}' : '.*\\S.*'" [disabled]="saving()" />
  </div>
  </div>
  <button type="submit" [disabled]="saving() || !profileForm.valid"
    class="flex min-h-13 w-full cursor-pointer items-center justify-center rounded-xl bg-primary px-5 py-3.5 text-sm font-medium text-white transition-colors hover:bg-[var(--color-primary-dark)] disabled:cursor-not-allowed disabled:opacity-50">
    {{ saving() ? 'Guardando...' : editing() ? 'Guardar cambios' : 'Continuar' }}
  </button>
</form>
