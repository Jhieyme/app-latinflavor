<main class="grid min-h-dvh place-items-center bg-cream px-4 py-8">
  <section class="login-card w-full max-w-md overflow-hidden rounded-3xl border border-border bg-white text-primary"
    aria-labelledby="login-title" [attr.aria-busy]="loading()">
    <header class="grid min-h-20 grid-cols-[44px_minmax(0,1fr)_44px] items-center border-b border-border/80 px-5 py-3">
      <a routerLink="/user/home"
        class="grid size-11 place-items-center rounded-full transition-colors hover:text-accent"
        aria-label="Volver al inicio" title="Volver al inicio">
        <svg class="size-5" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </a>
      <strong class="justify-self-center text-base font-semibold text-primary">Inicia sesión</strong>
      <span aria-hidden="true"></span>
    </header>

    <div class="px-6 pb-9 pt-9 sm:px-9 sm:pb-11">
      <h1 id="login-title" class="mt-3 text-center font-display text-3xl font-normal text-black">Casi listo</h1>
      <p class="mx-auto mt-4 max-w-sm text-center text-sm leading-6 text-muted">
        Te enviaremos un código para confirmar <br> tu reserva. Sin contraseña.
      </p>

      <form #emailForm="ngForm" class="mt-8" (ngSubmit)="submit()">
        <label for="email" class="mb-2 block text-sm font-medium text-primary">Correo electrónico</label>
        <app-input inputId="email" name="email" type="email" required email maxlength="254" autocomplete="email"
          [(ngModel)]="email" [disabled]="loading()" placeholder="tu@correo.com"
          [invalid]="errorMessage() ? true : null" describedBy="login-error"
         ></app-input>

        <button type="submit" [disabled]="loading() || !emailForm.valid"
          class="mt-5 flex min-h-13 w-full cursor-pointer items-center justify-center gap-2 rounded-xl bg-primary px-5 py-3.5 text-sm font-medium text-white transition-colors hover:bg-[var(--color-primary-dark)] disabled:cursor-not-allowed disabled:opacity-50">
          @if (loading()) {
          <span class="loading-indicator size-4 rounded-full border-2 border-white/40 border-t-white"
            aria-hidden="true"></span>
          Enviando…
          } @else {
          Enviar código
          <svg class="size-4" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14m-5-5 5 5-5 5" />
          </svg>
          }
        </button>
      </form>
      <p id="login-error" class="mt-4 min-h-5 text-center text-sm text-[var(--color-error)]" role="alert">
        {{ errorMessage() }}
      </p>
    </div>
  </section>
</main>
