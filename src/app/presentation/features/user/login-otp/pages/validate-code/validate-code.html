<main class="grid min-h-dvh place-items-center bg-cream px-4 py-8">
  <section class="validate-card w-full max-w-md overflow-hidden rounded-3xl border border-border bg-white text-primary"
    aria-labelledby="validate-title" [attr.aria-busy]="loading() || resending()">
    <header class="grid min-h-20 grid-cols-[44px_minmax(0,1fr)_44px] items-center border-b border-border/80 px-5 py-3">
      <a routerLink="/user/login-otp"
        class="grid size-11 place-items-center rounded-full transition-colors hover:text-accent"
        aria-label="Cambiar correo" title="Cambiar correo">
        <svg class="size-5" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </a>
      <strong class="justify-self-center text-base font-semibold text-primary">
        {{ session() ? 'Completa tu perfil' : 'Confirma tu acceso' }}
      </strong>
      <span aria-hidden="true"></span>
    </header>

    <div class="px-6 pb-10 pt-9 sm:px-9 sm:pb-12">
      @if (!session()) {
      <h1 id="validate-title" class="mt-5 text-center font-display text-3xl font-normal text-black">Revisa tu correo
      </h1>
      <p class="mt-4 text-center text-sm leading-6 text-muted">Enviamos un código de verificación a</p>
      <p class="mt-1 break-all text-center text-sm font-semibold text-primary">{{ email() }}</p>

      <form #codeForm="ngForm" class="mt-8" (ngSubmit)="submit()">
        <label for="code" class="relative block cursor-text">
          <span class="sr-only">Código de autenticación de 6 dígitos</span>
          <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" required
            pattern="[0-9]{6}" maxlength="6" [ngModel]="code" (ngModelChange)="updateCode($event)"
            (focus)="codeFocused.set(true)" (blur)="codeFocused.set(false)" [disabled]="loading() || resending()"
            aria-describedby="validate-error" [attr.aria-invalid]="errorMessage() ? true : null"
            class="code-input absolute inset-0 z-10 h-full w-full cursor-text opacity-0 disabled:cursor-not-allowed" />

          <span class="grid grid-cols-6 gap-2" aria-hidden="true">
            @for (position of codePositions; track position) {
            <span
              class="app-input app-input--otp relative grid place-items-center text-xl font-semibold"
              [class.code-cell-active]="isActivePosition(position)" [class.app-input--filled]="codeDigit(position)">
              {{ codeDigit(position) }}
              @if (isActivePosition(position)) {
              <span class="code-caret" [class.code-caret-filled]="codeDigit(position)" aria-hidden="true"></span>
              }
            </span>
            }
          </span>
        </label>

        <button type="submit" [disabled]="loading() || resending() || !codeForm.valid"
          class="mt-5 flex min-h-13 w-full cursor-pointer items-center justify-center gap-2 rounded-xl bg-primary px-5 py-3.5 text-sm font-medium text-white transition-colors hover:bg-[var(--color-primary-dark)] disabled:cursor-not-allowed disabled:opacity-50">
          @if (loading()) {
          <span class="loading-indicator size-4 rounded-full border-2 border-white/40 border-t-white"
            aria-hidden="true"></span>
          Validando…
          } @else {
          Validar código
          }
        </button>
      </form>
      <div class="mt-6 text-center">
        <p class="text-sm text-muted">¿No recibiste el código?</p>
        <button type="button" (click)="resendCode()"
          [disabled]="loading() || resending() || resendSeconds() > 0"
          class="mt-1 min-h-11 cursor-pointer rounded-lg px-4 text-sm font-semibold text-accent transition-colors hover:text-primary disabled:cursor-not-allowed disabled:text-muted">
          {{ resending() ? 'Enviando…' : resendSeconds() > 0 ? 'Reenviar en ' + resendSeconds() + ' s' : 'Reenviar' }}
        </button>
      </div>
      } @else {
      <app-complete-profile />
      }

      <p id="validate-error" class="mt-4 min-h-5 text-center text-sm text-[var(--color-error)]" role="alert">
        {{ errorMessage() }}
      </p>
    </div>
  </section>
</main>
